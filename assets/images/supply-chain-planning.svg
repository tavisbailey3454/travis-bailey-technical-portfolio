<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Supply chain planning workflow</title>
  <desc id="desc">A workflow diagram connecting demand, inventory, reorder point, material requirements, and execution.</desc>
  <rect width="1200" height="750" fill="#f6f8fb"/>
  <rect x="70" y="70" width="1060" height="610" rx="18" fill="#ffffff" stroke="#d8dee7" stroke-width="3"/>
  <text x="110" y="140" fill="#16202a" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">Supply Chain Planning Analysis</text>
  <text x="110" y="186" fill="#617083" font-family="Arial, Helvetica, sans-serif" font-size="24">Inventory decisions, reorder points, control charts, and MRP logic</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#17324d"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="120" y="290" width="170" height="120" rx="10" fill="#edf7f6" stroke="#0d7f7a" stroke-width="3"/>
    <text x="205" y="342" text-anchor="middle" fill="#075f5b" font-size="26" font-weight="700">Demand</text>
    <text x="205" y="376" text-anchor="middle" fill="#617083" font-size="18">forecast inputs</text>

    <line x1="290" y1="350" x2="400" y2="350" stroke="#17324d" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="410" y="290" width="170" height="120" rx="10" fill="#fff7e9" stroke="#c8861f" stroke-width="3"/>
    <text x="495" y="342" text-anchor="middle" fill="#835914" font-size="26" font-weight="700">Inventory</text>
    <text x="495" y="376" text-anchor="middle" fill="#617083" font-size="18">stock position</text>

    <line x1="580" y1="350" x2="690" y2="350" stroke="#17324d" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="700" y="290" width="170" height="120" rx="10" fill="#fbeeed" stroke="#b64a3d" stroke-width="3"/>
    <text x="785" y="334" text-anchor="middle" fill="#8c342b" font-size="25" font-weight="700">Reorder</text>
    <text x="785" y="364" text-anchor="middle" fill="#8c342b" font-size="25" font-weight="700">Point</text>
    <text x="785" y="393" text-anchor="middle" fill="#617083" font-size="18">trigger logic</text>

    <line x1="870" y1="350" x2="980" y2="350" stroke="#17324d" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="990" y="290" width="90" height="120" rx="10" fill="#eef3fb" stroke="#17324d" stroke-width="3"/>
    <text x="1035" y="343" text-anchor="middle" fill="#17324d" font-size="25" font-weight="700">MRP</text>
    <text x="1035" y="377" text-anchor="middle" fill="#617083" font-size="18">plan</text>

    <rect x="165" y="500" width="870" height="82" rx="10" fill="#16202a"/>
    <text x="600" y="552" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">Goal: translate operating data into better timing, purchasing, and execution decisions</text>
  </g>
</svg>
