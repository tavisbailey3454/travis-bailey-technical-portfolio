<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Staff project optimization dashboard</title>
  <desc id="desc">A dashboard-style illustration showing staff assignment, constraints, charts, and cost minimization.</desc>
  <rect width="1200" height="750" fill="#f5f7fa"/>
  <rect x="70" y="70" width="1060" height="610" rx="18" fill="#fff" stroke="#d8dee7" stroke-width="3"/>
  <text x="115" y="135" fill="#16202a" font-family="Arial" font-size="44" font-weight="700">Staff Project Optimization App</text>
  <text x="115" y="178" fill="#617083" font-family="Arial" font-size="23">Python + PyQt6 + PuLP linear programming</text>
  <rect x="115" y="235" width="300" height="330" rx="14" fill="#edf7f6" stroke="#0d7f7a" stroke-width="3"/>
  <text x="145" y="285" fill="#075f5b" font-family="Arial" font-size="27" font-weight="700">Inputs</text>
  <text x="145" y="330" fill="#16202a" font-family="Arial" font-size="22">API staff data</text>
  <text x="145" y="370" fill="#16202a" font-family="Arial" font-size="22">Project rates</text>
  <text x="145" y="410" fill="#16202a" font-family="Arial" font-size="22">Weekly hours</text>
  <text x="145" y="450" fill="#16202a" font-family="Arial" font-size="22">Role constraints</text>
  <rect x="465" y="235" width="300" height="330" rx="14" fill="#fff7e9" stroke="#c8861f" stroke-width="3"/>
  <text x="495" y="285" fill="#835914" font-family="Arial" font-size="27" font-weight="700">Model</text>
  <text x="495" y="330" fill="#16202a" font-family="Arial" font-size="22">Binary assignment</text>
  <text x="495" y="370" fill="#16202a" font-family="Arial" font-size="22">Minimize total cost</text>
  <text x="495" y="410" fill="#16202a" font-family="Arial" font-size="22">Limit weekly hours</text>
  <text x="495" y="450" fill="#16202a" font-family="Arial" font-size="22">Track idle time</text>
  <rect x="815" y="235" width="250" height="330" rx="14" fill="#eef3fb" stroke="#17324d" stroke-width="3"/>
  <text x="845" y="285" fill="#17324d" font-family="Arial" font-size="27" font-weight="700">Outputs</text>
  <rect x="850" y="325" width="165" height="22" fill="#0d7f7a"/>
  <rect x="850" y="365" width="125" height="22" fill="#c8861f"/>
  <rect x="850" y="405" width="190" height="22" fill="#b64a3d"/>
  <text x="850" y="470" fill="#16202a" font-family="Arial" font-size="22">Cost, profit, hours</text>
  <text x="850" y="510" fill="#16202a" font-family="Arial" font-size="22">Dashboard views</text>
</svg>
