<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">R data story analytics</title>
  <desc id="desc">A visualization showing data cleaning, summary tables, and polished R charts.</desc>
  <rect width="1200" height="750" fill="#f5f7fa"/>
  <rect x="70" y="70" width="1060" height="610" rx="18" fill="#fff" stroke="#d8dee7" stroke-width="3"/>
  <text x="115" y="135" fill="#16202a" font-family="Arial" font-size="44" font-weight="700">R Data Story and Visual Analytics</text>
  <text x="115" y="178" fill="#617083" font-family="Arial" font-size="23">Excel and CSV data transformed into publication-style visuals</text>
  <line x1="180" y1="560" x2="1030" y2="560" stroke="#d8dee7" stroke-width="3"/>
  <line x1="180" y1="240" x2="180" y2="560" stroke="#d8dee7" stroke-width="3"/>
  <rect x="250" y="410" width="95" height="150" fill="#0d7f7a"/>
  <rect x="390" y="350" width="95" height="210" fill="#c8861f"/>
  <rect x="530" y="285" width="95" height="275" fill="#17324d"/>
  <rect x="670" y="330" width="95" height="230" fill="#b64a3d"/>
  <rect x="810" y="260" width="95" height="300" fill="#617083"/>
  <text x="592" y="635" text-anchor="middle" fill="#16202a" font-family="Arial" font-size="25" font-weight="700">readxl + dplyr + tidyr + ggplot2</text>
  <text x="592" y="668" text-anchor="middle" fill="#617083" font-family="Arial" font-size="21">clean, summarize, visualize, export</text>
</svg>
