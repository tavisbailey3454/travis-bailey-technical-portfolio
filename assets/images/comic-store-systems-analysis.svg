<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Comic store systems analysis</title>
  <desc id="desc">A systems analysis diagram showing actors, use cases, and data entities for an online comic store.</desc>
  <rect width="1200" height="750" fill="#f5f7fa"/>
  <rect x="70" y="70" width="1060" height="610" rx="18" fill="#fff" stroke="#d8dee7" stroke-width="3"/>
  <text x="115" y="135" fill="#16202a" font-family="Arial" font-size="44" font-weight="700">Comic Store Systems Analysis</text>
  <text x="115" y="178" fill="#617083" font-family="Arial" font-size="23">Use cases, swimlanes, class diagrams, and CRUDE matrix documentation</text>
  <g font-family="Arial">
    <rect x="150" y="270" width="220" height="260" rx="14" fill="#edf7f6" stroke="#0d7f7a" stroke-width="3"/>
    <text x="260" y="330" text-anchor="middle" fill="#075f5b" font-size="28" font-weight="700">Customer</text>
    <text x="260" y="380" text-anchor="middle" fill="#16202a" font-size="22">Search comics</text>
    <text x="260" y="420" text-anchor="middle" fill="#16202a" font-size="22">Manage cart</text>
    <text x="260" y="460" text-anchor="middle" fill="#16202a" font-size="22">Checkout</text>
    <rect x="490" y="250" width="220" height="300" rx="14" fill="#eef3fb" stroke="#17324d" stroke-width="3"/>
    <text x="600" y="310" text-anchor="middle" fill="#17324d" font-size="28" font-weight="700">System</text>
    <text x="600" y="360" text-anchor="middle" fill="#16202a" font-size="22">Inventory</text>
    <text x="600" y="400" text-anchor="middle" fill="#16202a" font-size="22">Orders</text>
    <text x="600" y="440" text-anchor="middle" fill="#16202a" font-size="22">Payments</text>
    <text x="600" y="480" text-anchor="middle" fill="#16202a" font-size="22">Accounts</text>
    <rect x="830" y="270" width="220" height="260" rx="14" fill="#fff7e9" stroke="#c8861f" stroke-width="3"/>
    <text x="940" y="330" text-anchor="middle" fill="#835914" font-size="28" font-weight="700">Manager</text>
    <text x="940" y="380" text-anchor="middle" fill="#16202a" font-size="22">Add comic</text>
    <text x="940" y="420" text-anchor="middle" fill="#16202a" font-size="22">Update comic</text>
    <text x="940" y="460" text-anchor="middle" fill="#16202a" font-size="22">Remove comic</text>
    <line x1="370" y1="400" x2="490" y2="400" stroke="#17324d" stroke-width="4"/>
    <line x1="710" y1="400" x2="830" y2="400" stroke="#17324d" stroke-width="4"/>
  </g>
</svg>
