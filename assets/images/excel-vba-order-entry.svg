<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Excel VBA order entry workbook</title>
  <desc id="desc">A macro-enabled Excel order entry system with customer, product, and order history tables.</desc>
  <rect width="1200" height="750" fill="#f5f7fa"/>
  <rect x="70" y="70" width="1060" height="610" rx="18" fill="#fff" stroke="#d8dee7" stroke-width="3"/>
  <text x="115" y="135" fill="#16202a" font-family="Arial" font-size="44" font-weight="700">Excel VBA Order Entry System</text>
  <text x="115" y="178" fill="#617083" font-family="Arial" font-size="23">Macro-enabled workbook with order form, lookup tables, and transaction history</text>
  <g font-family="Arial">
    <rect x="140" y="250" width="320" height="340" rx="14" fill="#edf7f6" stroke="#0d7f7a" stroke-width="3"/>
    <text x="180" y="305" fill="#075f5b" font-size="28" font-weight="700">OrderEntry</text>
    <rect x="180" y="340" width="240" height="36" fill="#fff"/>
    <rect x="180" y="395" width="240" height="36" fill="#fff"/>
    <rect x="180" y="450" width="240" height="36" fill="#fff"/>
    <text x="190" y="365" fill="#16202a" font-size="20">Customer ID</text>
    <text x="190" y="420" fill="#16202a" font-size="20">Product ID</text>
    <text x="190" y="475" fill="#16202a" font-size="20">Quantity</text>
    <rect x="530" y="250" width="235" height="340" rx="14" fill="#fff7e9" stroke="#c8861f" stroke-width="3"/>
    <text x="565" y="305" fill="#835914" font-size="28" font-weight="700">Tables</text>
    <text x="565" y="360" fill="#16202a" font-size="22">Products</text>
    <text x="565" y="405" fill="#16202a" font-size="22">Customers</text>
    <text x="565" y="450" fill="#16202a" font-size="22">Order History</text>
    <rect x="835" y="250" width="225" height="340" rx="14" fill="#eef3fb" stroke="#17324d" stroke-width="3"/>
    <text x="870" y="305" fill="#17324d" font-size="28" font-weight="700">VBA</text>
    <text x="870" y="360" fill="#16202a" font-size="22">Validation</text>
    <text x="870" y="405" fill="#16202a" font-size="22">Automation</text>
    <text x="870" y="450" fill="#16202a" font-size="22">Data entry</text>
  </g>
</svg>
